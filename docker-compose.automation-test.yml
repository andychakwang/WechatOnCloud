# Automation test panel for the andy/automation-lab branch.
# It is intentionally isolated from the production panel:
# - container: woc-panel-automation-test
# - data dir:  ./data-panel-automation-test
# - host port: WOC_TEST_HTTP_PORT, default 36081
#
# Example:
#   WOC_IMAGE_PREFIX=ghcr.io/andychakwang \
#   WOC_VERSION=andy-automation-usable-r61-2026-07-05 \
#   WOC_TEST_HTTP_PORT=36081 \
#   PANEL_ALLOWED_HOSTS=nasbot.cloud \
#   docker compose -f docker-compose.automation-test.yml up -d

services:
  panel-automation-test:
    image: ${WOC_IMAGE_PREFIX:-ghcr.io/andychakwang}/woc-panel:${WOC_VERSION:-andy-automation-usable-r61-2026-07-05}
    container_name: woc-panel-automation-test

    environment:
      - PORT=8080
      - WOC_WECHAT_IMAGE=${WOC_IMAGE_PREFIX:-ghcr.io/andychakwang}/wechat-on-cloud:${WOC_VERSION:-andy-automation-usable-r61-2026-07-05}
      - PUID=${WOC_PUID:-1000}
      - PGID=${WOC_PGID:-1000}
      - TZ=${WOC_TZ:-Asia/Shanghai}
      - WOC_VIDEO_DEVICES=${WOC_VIDEO_DEVICES:-}
      - WOC_ENABLE_GPU=${WOC_ENABLE_GPU:-}
      - WOC_INSTANCE_MEM_GB=${WOC_INSTANCE_MEM_GB:-}
      - WOC_INSTANCE_MEM_SOFT_MB=${WOC_INSTANCE_MEM_SOFT_MB:-1500}
      - WOC_INSTANCE_MEM_HARD_MB=${WOC_INSTANCE_MEM_HARD_MB:-2500}
      - WOC_WATCHDOG_INTERVAL_SEC=${WOC_WATCHDOG_INTERVAL_SEC:-300}
      - WOC_SPOOF_OS=${WOC_SPOOF_OS:-1}
      - PANEL_ADMIN_USER=${WOC_TEST_USER:-admin}
      - PANEL_ADMIN_PASSWORD=${WOC_TEST_PASSWORD:-wechat}
      - PANEL_DATA=/data/accounts.json
      - PANEL_AUTOMATION_DATA=/data/automation.json
      - AUTOMATION_AI_API_KEY=${AUTOMATION_AI_API_KEY:-}
      - AUTOMATION_AI_BASE_URL=${AUTOMATION_AI_BASE_URL:-}
      - AUTOMATION_AI_MODEL=${AUTOMATION_AI_MODEL:-}
      - AUTOMATION_BRIDGE_TOKEN=${AUTOMATION_BRIDGE_TOKEN:-}
      - PANEL_ALLOWED_HOSTS=${PANEL_ALLOWED_HOSTS:-nasbot.cloud}

    volumes:
      - ./data-panel-automation-test:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /dev:/host-dev:ro

    ports:
      - "${WOC_TEST_HTTP_PORT:-36081}:8080"

    restart: unless-stopped
